
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b0a">

    <title>DeathCipher | Web Hub</title>

    <meta name="description"
          content="DeathCipher's official website hub. Explore projects, websites and creations.">

    <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="header">
        <div class="logo">DEATHCIPHER_</div>

        <nav>
            <a href="#websites">WEBSITES</a>
            <a href="https://github.com/DeathCipher"
               target="_blank" rel="noopener noreferrer">GITHUB</a>
        </nav>
    </header>

    <section class="hero">
        <div class="terminal">
            root@deathcipher:~$ ./explore_websites.sh
        </div>

        <h1>DEATH<span>CIPHER</span></h1>

        <p class="subtitle">
            One identity. Multiple projects. Unlimited possibilities.
        </p>

        <div class="status">
            [ SYSTEM ONLINE ] — WELCOME TO MY WEB HUB
        </div>
    </section>

    <main class="container" id="websites">

        <div class="section-title">
            // MY WEBSITES & PROJECTS
        </div>

        <div class="toolbar">
            <input
                id="search"
                type="search"
                placeholder="Search websites and projects..."
                autocomplete="off"
            >
        </div>

        <div class="grid" id="projects"></div>

        <div id="message">
            Connecting to GitHub...
        </div>

    </main>

    <footer>
        <p>DEATHCIPHER © <span id="year"></span></p>
        <p>Built with <span class="heart">♥</span> and code.</p>

        <a href="https://github.com/DeathCipher"
           target="_blank" rel="noopener noreferrer">
            github.com/DeathCipher
        </a>
    </footer>

    <script src="assets/js/main.js" defer></script>

</body>
</html>
